[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "adbc-driver-hardcharger"
dynamic = ["version"]
description = "Python ADBC driver for Hardcharger, GizmoData's DuckDB 2.0 server (on the Warp SQL ADBC driver)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "GizmoData", email = "support@gizmodata.com" }]
keywords = ["adbc", "arrow", "dbapi", "duckdb", "hardcharger", "warp-sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
# The Warp SQL driver does the work; this package adds hardcharger:// URIs and helpers.
# 0.x minor releases may change its API, hence the ceiling.
dependencies = [
    "adbc-driver-warpsql>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/gizmodata/hardcharger-adbc"
Repository = "https://github.com/gizmodata/hardcharger-adbc"
Changelog = "https://github.com/gizmodata/hardcharger-adbc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "cryptography>=50.0.2",
    "pyjwt>=2.15.1",
]
dev = [
    "ruff>=0.17.1",
    "build>=1.6.1",
]

[tool.hatch.version]
path = "src/adbc_driver_hardcharger/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/adbc_driver_hardcharger"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a hardcharger-server binary (HARDCHARGER_ADBC_TEST_SERVER_BINARY); fails without one",
]

[tool.ruff.lint.isort]
known-first-party = ["adbc_driver_hardcharger", "conftest", "mock_idp"]
